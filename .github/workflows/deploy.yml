name: Deploy Laravel

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: laravel-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    environment: production

    env:
      APP_NAME: "Green Tech Exim"
      APP_ENV: production
      APP_DEBUG: "false"
      APP_LOCALE: en
      APP_FALLBACK_LOCALE: en
      APP_FAKER_LOCALE: en_US
      APP_MAINTENANCE_DRIVER: file
      BCRYPT_ROUNDS: "12"
      LOG_CHANNEL: stack
      LOG_STACK: single
      LOG_DEPRECATIONS_CHANNEL: "null"
      LOG_LEVEL: error
      DB_CONNECTION: mysql
      DB_PORT: "3306"
      SESSION_DRIVER: database
      SESSION_LIFETIME: "120"
      SESSION_ENCRYPT: "false"
      SESSION_PATH: /
      SESSION_DOMAIN: "null"
      BROADCAST_CONNECTION: log
      FILESYSTEM_DISK: local
      QUEUE_CONNECTION: database
      CACHE_STORE: database
      MAIL_MAILER: log
      MAIL_FROM_NAME: "Green Tech Exim"
      VITE_APP_NAME: "Green Tech Exim"
      PHP_BIN: php83

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: dom, mbstring, pdo, pdo_mysql, fileinfo, openssl, tokenizer, xml, ctype, json
          coverage: none
          tools: composer

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install Composer dependencies
        run: composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader

      - name: Install Node dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      - name: Prepare Laravel directories
        run: |
          mkdir -p storage/logs
          mkdir -p storage/framework/{cache,sessions,views}
          chmod -R 775 storage bootstrap/cache

      - name: Create production .env
        env:
          APP_KEY: ${{ secrets.APP_KEY }}
          APP_URL: ${{ secrets.APP_URL }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_DATABASE: ${{ secrets.DB_DATABASE }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          MAIL_FROM_ADDRESS: ${{ secrets.MAIL_FROM_ADDRESS }}
        run: |
          {
            echo "APP_NAME=\"${APP_NAME}\""
            echo "APP_ENV=${APP_ENV}"
            echo "APP_KEY=${APP_KEY}"
            echo "APP_DEBUG=${APP_DEBUG}"
            echo "APP_URL=${APP_URL}"
            echo "APP_LOCALE=${APP_LOCALE}"
            echo "APP_FALLBACK_LOCALE=${APP_FALLBACK_LOCALE}"
            echo "APP_FAKER_LOCALE=${APP_FAKER_LOCALE}"
            echo "APP_MAINTENANCE_DRIVER=${APP_MAINTENANCE_DRIVER}"
            echo "BCRYPT_ROUNDS=${BCRYPT_ROUNDS}"
            echo "LOG_CHANNEL=${LOG_CHANNEL}"
            echo "LOG_STACK=${LOG_STACK}"
            echo "LOG_DEPRECATIONS_CHANNEL=${LOG_DEPRECATIONS_CHANNEL}"
            echo "LOG_LEVEL=${LOG_LEVEL}"
            echo "DB_CONNECTION=${DB_CONNECTION}"
            echo "DB_HOST=${DB_HOST:-127.0.0.1}"
            echo "DB_PORT=${DB_PORT}"
            echo "DB_DATABASE=${DB_DATABASE}"
            echo "DB_USERNAME=${DB_USERNAME}"
            echo "DB_PASSWORD=\"${DB_PASSWORD}\""
            echo "SESSION_DRIVER=${SESSION_DRIVER}"
            echo "SESSION_LIFETIME=${SESSION_LIFETIME}"
            echo "SESSION_ENCRYPT=${SESSION_ENCRYPT}"
            echo "SESSION_PATH=${SESSION_PATH}"
            echo "SESSION_DOMAIN=${SESSION_DOMAIN}"
            echo "BROADCAST_CONNECTION=${BROADCAST_CONNECTION}"
            echo "FILESYSTEM_DISK=${FILESYSTEM_DISK}"
            echo "QUEUE_CONNECTION=${QUEUE_CONNECTION}"
            echo "CACHE_STORE=${CACHE_STORE}"
            echo "MAIL_MAILER=${MAIL_MAILER}"
            echo "MAIL_FROM_ADDRESS=${MAIL_FROM_ADDRESS:-hello@example.com}"
            echo "MAIL_FROM_NAME=\"${MAIL_FROM_NAME}\""
            echo "VITE_APP_NAME=\"${VITE_APP_NAME}\""
          } > .env

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add server to known hosts
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p "${SSH_PORT:-2036}" "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Upload application
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          tar \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.env.example' \
            --exclude='node_modules' \
            --exclude='tests' \
            --exclude='phpunit.xml' \
            --exclude='storage/app' \
            --exclude='storage/logs' \
            --exclude='storage/framework/cache' \
            --exclude='storage/framework/sessions' \
            --exclude='storage/framework/views' \
            -czf /tmp/green-tech-web.tar.gz .

          ssh -p "${SSH_PORT:-2036}" -o StrictHostKeyChecking=yes \
            "${SSH_USERNAME}@${SSH_HOST}" \
            "mkdir -p '${DEPLOY_PATH}'"

          scp -P "${SSH_PORT:-2036}" -o StrictHostKeyChecking=yes \
            /tmp/green-tech-web.tar.gz \
            "${SSH_USERNAME}@${SSH_HOST}:${DEPLOY_PATH}/.deploy-upload.tar.gz"

          ssh -p "${SSH_PORT:-2036}" -o StrictHostKeyChecking=yes \
            "${SSH_USERNAME}@${SSH_HOST}" \
            "tar -xzf '${DEPLOY_PATH}/.deploy-upload.tar.gz' -C '${DEPLOY_PATH}' && rm -f '${DEPLOY_PATH}/.deploy-upload.tar.gz'"

      - name: Run remote Laravel commands
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          ssh -p "${SSH_PORT:-2036}" "${SSH_USERNAME}@${SSH_HOST}" "bash -s" <<EOF
          set -e
          cd "${DEPLOY_PATH}"
          PHP_BIN="${PHP_BIN}"
          for candidate in \\
            php83 \\
            /opt/cpanel/ea-php83/root/usr/bin/php \\
            /usr/local/bin/ea-php83 \\
            /opt/alt/php83/usr/bin/php
          do
            if [ -x "\$candidate" ] || command -v "\$candidate" >/dev/null 2>&1; then
              PHP_BIN="\$candidate"
              break
            fi
          done
          if ! command -v "\$PHP_BIN" >/dev/null 2>&1 && [ ! -x "\$PHP_BIN" ]; then
            echo "PHP 8.3 binary not found. Expected php83 or a PHP 8.3 server binary."
            exit 1
          fi
          mkdir -p storage/logs storage/framework/cache storage/framework/sessions storage/framework/views storage/app/public bootstrap/cache public_html
          if [ -d public ] && [ "\$(cd public && pwd)" != "\$(cd public_html && pwd)" ]; then
            cp -a public/. public_html/
          fi
          "\$PHP_BIN" artisan storage:link --force
          ln -sfn ../storage/app/public public_html/storage
          "\$PHP_BIN" artisan migrate --force
          "\$PHP_BIN" artisan config:cache
          "\$PHP_BIN" artisan route:cache
          "\$PHP_BIN" artisan view:cache
          EOF
